name: Build PS5 ezRemote Client

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Enable HTTPS for submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash clang-18 lld-18 wget cmake meson pkg-config python3 python3-pyelftools unzip zip libsdl2-dev libsdl2-image-dev libpng-dev libjpeg-dev libxml2-dev libssh2-1-dev libarchive-dev libcurl4-openssl-dev libssl-dev libzstd-dev liblzma-dev libbz2-dev libsamplerate0-dev libminizip-dev

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo unzip -q -d /opt /tmp/ps5-payload-sdk.zip
          test -d /opt/ps5-payload-sdk
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Install PS5 homebrew libraries
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz -O /tmp/ps5-payload-dev.tar.gz
          sudo tar -xzf /tmp/ps5-payload-dev.tar.gz -C /
          test -f /opt/ps5-payload-sdk/target/user/homebrew/include/lexbor/html/parser.h
          test -f /opt/ps5-payload-sdk/target/user/homebrew/lib/liblexbor_static.a

      - name: Configure
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake --build build --target ezremote_client.elf -j2

      - name: Package
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake --build build --target package -j2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps5-ezremote-client-native-${{ github.sha }}
          path: |
            ezremote-client.zip
            ezremote_client.elf
            ps5-ezremote-server/ezremote-server.elf
            ps5-ezremote-dpi/ezremote-dpi.elf
          if-no-files-found: warn
